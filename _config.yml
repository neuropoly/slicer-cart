# Basic site parameters
title: CART
description: The Case Annotation and Review Tool (CART) for 3D Slicer!
theme: just-the-docs

# Use the CART logo instead of its name
logo: "/resources/icon/icon.png"

url: https://just-the-docs.github.io

# Gives the site a dark theme so it doesn't hurt to look at
color_scheme: dark

# Callouts (examples given by Just the Docs) files
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

aux_links:
  Template Repository: https://github.com/just-the-docs/just-the-docs-template
